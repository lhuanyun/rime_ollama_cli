name: Build Rust CLI

# 触发条件：当推送到 main 或 master 分支，或者在网页上手动点击运行时触发
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: 

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    # 策略矩阵：同时在 Windows 和最新版 Ubuntu (兼容 Debian) 上进行编译
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: rime_ollama_cli.exe
            asset_name: rime_ollama_cli-windows
          - os: ubuntu-latest
            artifact_name: rime_ollama_cli
            asset_name: rime_ollama_cli-linux

    steps:
    # 第一步：拉取你的最新代码
    - name: Checkout repository
      uses: actions/checkout@v4

    # 第二步：安装稳定版 Rust 编译环境
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    # 第三步：执行 Release 极致优化编译
    - name: Build Release
      run: cargo build --release

    # 第四步：将编译好的成品提取出来，提供给你下载
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset_name }}
        path: target/release/${{ matrix.artifact_name }}
